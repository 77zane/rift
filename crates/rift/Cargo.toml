[package]
name = "rift"
version = "0.1.0"
edition = "2021"
description = "Rift — ultra-thin cross-platform terminal mirror & multi-host web relay client"
license = "MIT"

[[bin]]
name = "rift"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
futures-util = "0.3"
hostname = "0.4"
portable-pty = "0.8"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
