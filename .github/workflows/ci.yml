name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify (Linux — TS + Rust + Browser Smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Run unified check gate (local == CI)
        run: npm run check
        env:
          RIFT_REQUIRE_BROWSER: "1"
          SPEC_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          SPEC_BEFORE_SHA: ${{ github.event.before }}

  verify-windows-rust:
    name: Verify Rust (Windows — ConPTY & Win32 FFI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check & test Rust crate on Windows
        run: |
          cargo check --manifest-path crates/rift/Cargo.toml
          cargo test --manifest-path crates/rift/Cargo.toml

  verify-windows-real:
    name: Verify Real Binary (Windows — ConPTY keys + full E2E)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Build all TS workspaces
        run: npm run build

      - name: Build release rift binary
        run: cargo build --release --manifest-path crates/rift/Cargo.toml

      - name: Nested ConPTY key contract (real rift.exe)
        run: npm run test:win-keys

      - name: Full relay + Rust binary E2E
        run: npm run test:e2e
